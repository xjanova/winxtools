name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        TAG=${GITHUB_REF#refs/tags/v}
        echo "version=$TAG" >> $GITHUB_OUTPUT
        echo "Building version: $TAG"

    - name: Update version in project
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $csproj = "src/NetX.App/NetX.App.csproj"
        $content = Get-Content $csproj -Raw
        $content = $content -replace '<Version>.*?</Version>', "<Version>$version</Version>"
        Set-Content $csproj $content
        Write-Host "Updated version to $version"

    - name: Restore dependencies
      run: dotnet restore src/NetX.App/NetX.App.csproj

    - name: Publish (self-contained single file)
      run: |
        dotnet publish src/NetX.App/NetX.App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish

    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path publish/* -DestinationPath "WinXTools-v${{ steps.version.outputs.version }}-win-x64.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "WinXTools v${{ steps.version.outputs.version }}"
        body: |
          ## WinXTools v${{ steps.version.outputs.version }}

          ### Installation
          1. Download `WinXTools-v${{ steps.version.outputs.version }}-win-x64.zip`
          2. Extract to any folder
          3. Run `WinXTools.exe` as Administrator

          ### Auto-Update
          Existing users will be notified of this update automatically.
        files: |
          WinXTools-v${{ steps.version.outputs.version }}-win-x64.zip
          publish/WinXTools.exe
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify xman studio
      if: success()
      shell: pwsh
      continue-on-error: true
      run: |
        $body = @{
          product_slug = "winxtools"
          version = "${{ steps.version.outputs.version }}"
          source = "github_actions"
        } | ConvertTo-Json
        try {
          Invoke-RestMethod -Uri "https://xman4289.com/api/v1/webhooks/release" -Method POST -Body $body -ContentType "application/json" -TimeoutSec 10
          Write-Host "Notified xman studio of new release"
        } catch {
          Write-Host "Could not notify xman studio (non-critical): $_"
        }
